[project]
name = "carebridge-backend"
version = "0.1.0"
description = "CareBridge API — Phase 1 foundation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "sqlalchemy>=2.0.35,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.12",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "pillow>=10",
    "rapidocr-onnxruntime>=1.4",
    # The AI provider adapters call their APIs over HTTP with it (D-023).
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]
