services:
  postgres:
    image: postgres:16-alpine
    container_name: carebridge-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carebridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carebridge_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-carebridge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - carebridge-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carebridge} -d ${POSTGRES_DB:-carebridge}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  carebridge-pgdata:
